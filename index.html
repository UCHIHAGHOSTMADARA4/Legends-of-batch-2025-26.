<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Mira – Blink Mirror</title>
<!-- face-api.js from CDN -->
<script defer src="https://unpkg.com/face-api.js@0.22.2/dist/face-api.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: radial-gradient(circle at 20% 30%, #ffe6f0, #e0c3fc);
    min-height:100vh;
    display:flex; justify-content:center; align-items:center;
    font-family: 'Segoe UI', sans-serif;
    overflow:hidden;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* Bokeh background animation */
  .bokeh {
    position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none;
    z-index:0;
  }
  .bokeh span {
    position:absolute;
    display:block;
    background: rgba(255,255,255,0.15);
    border-radius:50%;
    animation: float 8s infinite ease-in-out;
  }
  @keyframes float {
    0%,100% { transform: translateY(0) scale(1); opacity:0.3; }
    50% { transform: translateY(-40px) scale(1.5); opacity:0; }
  }

  /* Main container */
  .container {
    position:relative; z-index:1;
    display:flex; flex-direction:column; align-items:center;
    gap:20px;
  }

  /* Character canvas */
  .character {
    width:260px; height:320px;
    position:relative;
    transform-origin: center bottom;
    animation: breathe 3s ease-in-out infinite, headTilt 8s ease-in-out infinite;
  }
  @keyframes breathe {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.02); }
  }
  @keyframes headTilt {
    0%,100% { transform: rotate(0deg); }
    25% { transform: rotate(1.5deg); }
    75% { transform: rotate(-1.5deg); }
  }

  /* Hair back layer */
  .hair-back {
    position:absolute; bottom:40px; left:50%; transform:translateX(-50%);
    width:180px; height:180px;
    background: #f8a5c2;
    border-radius: 50% 50% 40% 40%;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    z-index:1;
  }
  /* Twintails */
  .twintail {
    position:absolute;
    width:40px; height:120px;
    background: #f8a5c2;
    border-radius: 50%;
    z-index:0;
    transform-origin: top center;
    animation: hairSway 4s ease-in-out infinite;
  }
  .twintail.left {
    left:20px; top:100px;
    animation-delay: 0s;
  }
  .twintail.right {
    right:20px; top:100px;
    animation-delay: -2s;
  }
  @keyframes hairSway {
    0%,100% { transform: rotate(0deg); }
    25% { transform: rotate(5deg); }
    75% { transform: rotate(-5deg); }
  }

  /* Face */
  .face {
    position:absolute;
    bottom:60px; left:50%; transform:translateX(-50%);
    width:150px; height:130px;
    background: #fff4e6;
    border-radius: 50% 50% 45% 45%;
    box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    z-index:2;
  }

  /* Eyes container */
  .eyes {
    position:absolute;
    top:45px; left:50%; transform:translateX(-50%);
    display:flex; gap:28px;
  }
  .eye {
    width:36px; height:36px;
    background: #fff;
    border-radius:50%;
    box-shadow: inset 0 0 5px rgba(0,0,0,0.1);
    position:relative;
    overflow:hidden;
    transition: transform 0.08s ease;
  }
  /* Iris */
  .eye::before {
    content:'';
    position:absolute;
    width:22px; height:22px;
    background: radial-gradient(circle at 30% 30%, #9b59b6, #4a235a);
    border-radius:50%;
    top:50%; left:50%;
    transform:translate(-50%,-50%);
  }
  /* Highlight */
  .eye::after {
    content:'';
    position:absolute;
    width:6px; height:6px;
    background:white;
    border-radius:50%;
    top:6px; left:8px;
    box-shadow: 0 0 4px white;
  }

  /* Closed eye state (class will be toggled) */
  .eye.closed {
    transform: scaleY(0.05);
  }

  /* Cheeks */
  .cheek {
    position:absolute; top:70px;
    width:20px; height:12px;
    background: rgba(255,140,140,0.5);
    border-radius:50%;
    filter: blur(3px);
    transition: transform 0.3s;
  }
  .cheek.left { left:15px; }
  .cheek.right { right:15px; }
  .cheek.blush { transform: scale(1.8); background: rgba(255,100,100,0.7); }

  /* Mouth */
  .mouth {
    position:absolute;
    bottom:25px; left:50%; transform:translateX(-50%);
    width:16px; height:8px;
    border-bottom: 3px solid #d4869c;
    border-radius:0 0 50% 50%;
  }
  .mouth.smile {
    width:24px; height:12px;
    border-bottom-width: 3px;
    border-radius:0 0 80% 80%;
  }

  /* Puzzled overlay */
  .question-mark {
    display:none;
    position:absolute; top:-20px; right:10px;
    font-size:40px;
    color:#ff6347;
    z-index:5;
    animation: pop 0.6s ease-in-out;
  }
  @keyframes pop {
    0% { transform: scale(0); }
    80% { transform: scale(1.3); }
    100% { transform: scale(1); }
  }

  /* Camera preview */
  .camera-preview {
    position:fixed; bottom:20px; right:20px;
    width:80px; height:100px;
    border-radius:16px;
    border:2px solid white;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    overflow:hidden;
    z-index:10;
    background:#000;
  }
  .camera-preview video {
    width:100%; height:100%; object-fit:cover;
    transform: scaleX(-1);
  }

  /* UI elements */
  .ui-bar {
    position:fixed; top:10px; left:10px; right:10px;
    display:flex; justify-content:space-between;
    align-items:center;
    z-index:10;
    color:white; text-shadow: 0 2px 4px rgba(0,0,0,0.5);
  }
  .name { font-size:24px; font-weight:bold; }
  .settings-icon { font-size:28px; cursor:pointer; }

  /* Tutorial overlay */
  .tutorial {
    position:fixed; top:0; left:0; width:100%; height:100%;
    background: rgba(0,0,0,0.8); z-index:20;
    display:flex; justify-content:center; align-items:center;
    flex-direction:column; gap:20px;
    color:white; text-align:center;
    padding:20px;
  }
  .tutorial button {
    background: #ff8c94; border:none; padding:12px 30px;
    border-radius:30px; font-size:18px; color:white;
    cursor:pointer;
  }
</style>
</head>
<body>

<!-- Bokeh background -->
<div class="bokeh" id="bokeh"></div>

<!-- UI Bar -->
<div class="ui-bar">
  <div class="name">Mira ✨</div>
  <div class="settings-icon">⚙️</div>
</div>

<!-- Tutorial overlay (shown on first visit) -->
<div class="tutorial" id="tutorial">
  <h2>Let Mira see you blink!</h2>
  <p>Allow camera access so she can mimic your blinks.</p>
  <button id="startBtn">Start Experience</button>
  <p style="font-size:12px; opacity:0.7;">(Your video stays on your device.)</p>
</div>

<!-- Character -->
<div class="container">
  <div class="character" id="character">
    <div class="hair-back"></div>
    <div class="twintail left"></div>
    <div class="twintail right"></div>
    <div class="face">
      <div class="eyes">
        <div class="eye left" id="leftEye"></div>
        <div class="eye right" id="rightEye"></div>
      </div>
      <div class="cheek left" id="leftCheek"></div>
      <div class="cheek right" id="rightCheek"></div>
      <div class="mouth" id="mouth"></div>
    </div>
    <div class="question-mark" id="questionMark">❓</div>
  </div>
</div>

<!-- Camera preview -->
<div class="camera-preview" id="cameraPreview" style="display:none;">
  <video id="video" playsinline autoplay muted></video>
</div>

<script>
// ========== GLOBAL VARIABLES ==========
const video = document.getElementById('video');
const leftEyeEl = document.getElementById('leftEye');
const rightEyeEl = document.getElementById('rightEye');
const mouthEl = document.getElementById('mouth');
const leftCheek = document.getElementById('leftCheek');
const rightCheek = document.getElementById('rightCheek');
const questionMark = document.getElementById('questionMark');
const startBtn = document.getElementById('startBtn');
const tutorial = document.getElementById('tutorial');
const cameraPreview = document.getElementById('cameraPreview');

let faceDetectionInterval;
let lastBlinkTime = 0;
let isUserBlinking = false;
let autoBlinkTimeout;
let faceLostTimer;
let faceLost = false;

// EAR threshold for closed eyes
const EAR_THRESHOLD = 0.25;
// Smile threshold (mouth aspect ratio)
const MAR_THRESHOLD = 0.6;

// ========== BOKEH CREATION ==========
function createBokeh() {
  const bokehContainer = document.getElementById('bokeh');
  for (let i=0; i<15; i++) {
    const span = document.createElement('span');
    const size = Math.random() * 80 + 20;
    span.style.width = size + 'px';
    span.style.height = size + 'px';
    span.style.left = Math.random()*100 + '%';
    span.style.top = Math.random()*100 + '%';
    span.style.animationDelay = Math.random()*8 + 's';
    bokehContainer.appendChild(span);
  }
}
createBokeh();

// ========== ANIMATION HELPERS ==========
function blinkEyes(closeDuration = 150) {
  const eyes = [leftEyeEl, rightEyeEl];
  eyes.forEach(eye => eye.classList.add('closed'));
  setTimeout(() => {
    eyes.forEach(eye => eye.classList.remove('closed'));
  }, closeDuration);
}

// Autonomous blink every 3-4 seconds if user not blinking
function scheduleAutoBlink() {
  clearTimeout(autoBlinkTimeout);
  const delay = 3000 + Math.random() * 1500;
  autoBlinkTimeout = setTimeout(() => {
    if (!isUserBlinking) {
      blinkEyes(150);
    }
    scheduleAutoBlink(); // loop
  }, delay);
}

// Smile detection -> cheeks blush + bigger smile mouth
function setSmileState(smiling) {
  if (smiling) {
    leftCheek.classList.add('blush');
    rightCheek.classList.add('blush');
    mouthEl.classList.add('smile');
  } else {
    leftCheek.classList.remove('blush');
    rightCheek.classList.remove('blush');
    mouthEl.classList.remove('smile');
  }
}

// Show/hide question mark when face lost
function setFaceLost(lost) {
  if (lost && !faceLost) {
    questionMark.style.display = 'block';
    faceLost = true;
  } else if (!lost && faceLost) {
    questionMark.style.display = 'none';
    faceLost = false;
  }
}

// ========== EYE ASPECT RATIO (EAR) ==========
function eyeAspectRatio(eye) {
  const A = distance(eye[1], eye[5]);
  const B = distance(eye[2], eye[4]);
  const C = distance(eye[0], eye[3]);
  return (A + B) / (2.0 * C);
}
function distance(pt1, pt2) {
  return Math.sqrt(Math.pow(pt1.x - pt2.x, 2) + Math.pow(pt1.y - pt2.y, 2));
}

// ========== MOUTH ASPECT RATIO (MAR) for smile ==========
function mouthAspectRatio(mouth) {
  // mouth landmarks: 48-67 (20 points). Use outer contour points: 48-54 top, 54-60 bottom?
  // Simpler: use width of mouth (distance between corners 48 and 54) and height (distance 51 and 57)
  const leftCorner = mouth[0];   // 48
  const rightCorner = mouth[6]; // 54
  const topLip = mouth[3];      // 51
  const bottomLip = mouth[9];   // 57
  const width = distance(leftCorner, rightCorner);
  const height = distance(topLip, bottomLip);
  return height / width;
}

// ========== FACE DETECTION LOOP ==========
async function onFaceDetected() {
  if (!video.paused && !video.ended) {
    const detections = await faceapi.detectSingleFace(video,
      new faceapi.TinyFaceDetectorOptions({ inputSize: 160 }))
      .withFaceLandmarks();

    if (detections && detections.landmarks) {
      // Face found: clear lost timer
      if (faceLost) {
        setFaceLost(false);
        clearTimeout(faceLostTimer);
      }

      const landmarks = detections.landmarks;
      const leftEye = landmarks.getLeftEye();
      const rightEye = landmarks.getRightEye();
      const mouthPoints = landmarks.getMouth();

      // Blink detection
      const earLeft = eyeAspectRatio(leftEye);
      const earRight = eyeAspectRatio(rightEye);
      const avgEAR = (earLeft + earRight) / 2;

      const now = Date.now();
      if (avgEAR < EAR_THRESHOLD && !isUserBlinking && (now - lastBlinkTime) > 300) {
        // User blinked
        isUserBlinking = true;
        lastBlinkTime = now;
        blinkEyes(150);
        setTimeout(() => { isUserBlinking = false; }, 300); // cooldown
      }

      // Smile detection
      const mar = mouthAspectRatio(mouthPoints);
      setSmileState(mar > MAR_THRESHOLD);

      // Reset face lost timer
      clearTimeout(faceLostTimer);
      faceLostTimer = setTimeout(() => {
        setFaceLost(true);
      }, 2000);
    } else {
      // No face detected -> start timer
      clearTimeout(faceLostTimer);
      faceLostTimer = setTimeout(() => {
        setFaceLost(true);
      }, 2000);
    }
  }
}

// ========== START CAMERA & DETECTION ==========
async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user", width: { ideal: 320 }, height: { ideal: 240 } }
    });
    video.srcObject = stream;
    video.play();

    // Show camera preview
    cameraPreview.style.display = 'block';

    // Load face-api models (they must be in /models folder)
    await faceapi.nets.tinyFaceDetector.load('/models/');
    await faceapi.nets.faceLandmark68Net.load('/models/');

    // Start detection loop (every 120ms ~8fps)
    faceDetectionInterval = setInterval(onFaceDetected, 120);

    // Start autonomous blinking
    scheduleAutoBlink();

    // Hide tutorial
    tutorial.style.display = 'none';
    localStorage.setItem('miraTutorialShown', 'true');
  } catch (err) {
    alert('Camera access denied or not available. Please allow camera permissions.');
    console.error(err);
  }
}

// ========== INITIALIZATION ==========
window.addEventListener('load', () => {
  // Check if tutorial already shown
  if (localStorage.getItem('miraTutorialShown') === 'true') {
    tutorial.style.display = 'none';
    startCamera();
  } else {
    tutorial.style.display = 'flex';
  }
});

startBtn.addEventListener('click', startCamera);

// Cleanup on page unload (optional)
window.addEventListener('beforeunload', () => {
  clearInterval(faceDetectionInterval);
  clearTimeout(faceLostTimer);
  clearTimeout(autoBlinkTimeout);
  if (video.srcObject) {
    video.srcObject.getTracks().forEach(track => track.stop());
  }
});
</script>
</body>
    </html>
