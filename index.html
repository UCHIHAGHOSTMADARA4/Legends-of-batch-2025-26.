<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Live2D Blink Mirror ✨</title>
<script src="https://cdn.jsdelivr.net/npm/pixi.js@7.3.2/dist/pixi.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display@0.4.0/dist/index.min.js"></script>
<script defer src="https://unpkg.com/face-api.js@0.22.2/dist/face-api.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: radial-gradient(ellipse at 30% 30%, #1a1a2e, #0f0f1a);
    display: flex; justify-content: center; align-items: center;
    height: 100vh; width: 100vw;
    overflow: hidden;
    font-family: 'Segoe UI', sans-serif;
    user-select: none;
  }
  #canvas-container {
    width: 100vw; height: 100vh;
    display: flex; justify-content: center; align-items: center;
  }
  .camera-preview {
    position: fixed; bottom: 20px; right: 20px;
    width: 80px; height: 100px;
    border-radius: 16px;
    border: 2px solid rgba(255,255,255,0.8);
    box-shadow: 0 4px 20px rgba(0,0,0,0.8);
    overflow: hidden;
    z-index: 50;
    background: #000;
    display: none;
  }
  .camera-preview video {
    width: 100%; height: 100%;
    object-fit: cover;
    transform: scaleX(-1);
  }
  .ui-bar {
    position: fixed; top: 10px; left: 10px; right: 10px;
    display: flex; justify-content: space-between;
    align-items: center;
    z-index: 50;
    color: white; text-shadow: 0 2px 5px black;
    font-size: 22px; font-weight: bold;
  }
  .tutorial {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.85);
    z-index: 100;
    display: flex; justify-content: center; align-items: center;
    flex-direction: column; gap: 25px;
    color: white; text-align: center;
    padding: 30px;
  }
  .tutorial h2 { font-size: 28px; }
  .tutorial button {
    background: #ff4d6d; border: none;
    padding: 14px 36px; border-radius: 40px;
    font-size: 20px; color: white; cursor: pointer;
    box-shadow: 0 0 20px #ff4d6d;
  }
</style>
</head>
<body>
<div class="ui-bar">
  <span>Live2D Blink ✨</span>
  <span>⚙️</span>
</div>

<div class="tutorial" id="tutorial">
  <h2>Blink – and she blinks with you!</h2>
  <p>Allow camera access to start the mirroring.</p>
  <button id="startBtn">✨ Start</button>
  <p style="font-size:13px; opacity:0.7;">(Your video never leaves your device.)</p>
</div>

<div id="canvas-container"></div>

<div class="camera-preview" id="cameraPreview">
  <video id="video" playsinline autoplay muted></video>
</div>

<script>
// ---------- DOM ----------
const video = document.getElementById('video');
const startBtn = document.getElementById('startBtn');
const tutorial = document.getElementById('tutorial');
const cameraPreview = document.getElementById('cameraPreview');
const container = document.getElementById('canvas-container');

// ---------- face-api model path ----------
const MODEL_URL = 'https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@master/weights/';

// ---------- Live2D model URL (Haru, free sample) ----------
const LIVE2D_MODEL_URL = 'https://cdn.jsdelivr.net/gh/Live2D/CubismWebSamples@main/Samples/Resources/Haru/Haru.model3.json';

// ---------- Blink detection variables ----------
let faceDetectionInterval;
let lastBlinkTime = 0;
let userBlinking = false;
let currentEyeValue = 1.0;  // target eye open (1 = fully open)

// ---------- Pixi application & model ----------
let app;
let live2dModel;

// ---------- Set up PixiJS and load the model ----------
async function initLive2D() {
  app = new PIXI.Application({
    resizeTo: container,
    backgroundAlpha: 0,
    antialias: true,
    resolution: window.devicePixelRatio || 1,
    autoDensity: true,
  });
  container.appendChild(app.view);

  // Load model
  live2dModel = await PIXI.live2d.Live2DModel.from(LIVE2D_MODEL_URL, { autoInteract: false });
  live2dModel.anchor.set(0.5, 0.5);
  live2dModel.scale.set(0.2);  // scale down to fit
  live2dModel.position.set(app.screen.width / 2, app.screen.height / 2);

  app.stage.addChild(live2dModel);

  // Important: we need to update the eye parameters every frame
  // based on the currentEyeValue (which is driven by blink detection).
  app.ticker.add(() => {
    if (live2dModel) {
      // Slowly interpolate toward currentEyeValue for smooth transitions
      const currentL = live2dModel.internalModel.coreModel.getParameterValueById('ParamEyeLOpen');
      const currentR = live2dModel.internalModel.coreModel.getParameterValueById('ParamEyeROpen');
      const speed = 0.3;  // how quickly eyes follow the target value
      const newL = currentL + (currentEyeValue - currentL) * speed;
      const newR = currentR + (currentEyeValue - currentR) * speed;
      live2dModel.internalModel.coreModel.setParameterValueById('ParamEyeLOpen', newL);
      live2dModel.internalModel.coreModel.setParameterValueById('ParamEyeROpen', newR);
    }
  });
}

// ---------- Blink mirror logic (face-api) ----------
async function onFaceDetected() {
  if (video.paused || video.ended) return;
  const detection = await faceapi.detectSingleFace(
    video,
    new faceapi.TinyFaceDetectorOptions({ inputSize: 160 })
  ).withFaceLandmarks();

  if (detection && detection.landmarks) {
    const leftEye = detection.landmarks.getLeftEye();
    const rightEye = detection.landmarks.getRightEye();
    const EAR = (eyeAspectRatio(leftEye) + eyeAspectRatio(rightEye)) / 2;

    const now = Date.now();
    if (EAR < 0.25 && !userBlinking && (now - lastBlinkTime) > 300) {
      // User blinked
      userBlinking = true;
      lastBlinkTime = now;
      currentEyeValue = 0.0;         // close model's eyes
      setTimeout(() => {
        currentEyeValue = 1.0;       // open back
        userBlinking = false;
      }, 150);
    }
  }
}

function eyeAspectRatio(eye) {
  const A = Math.hypot(eye[1].x - eye[5].x, eye[1].y - eye[5].y);
  const B = Math.hypot(eye[2].x - eye[4].x, eye[2].y - eye[4].y);
  const C = Math.hypot(eye[0].x - eye[3].x, eye[0].y - eye[3].y);
  return (A + B) / (2.0 * C);
}

// ---------- Start camera and detection ----------
async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user", width: { ideal: 320 }, height: { ideal: 240 } }
    });
    video.srcObject = stream;
    await video.play();
    cameraPreview.style.display = 'block';

    await faceapi.nets.tinyFaceDetector.load(MODEL_URL);
    await faceapi.nets.faceLandmark68Net.load(MODEL_URL);

    faceDetectionInterval = setInterval(onFaceDetected, 120);
    tutorial.style.display = 'none';
    localStorage.setItem('live2dTutorial', '1');
  } catch (err) {
    alert('Camera access denied. Please allow camera permission.');
    console.error(err);
  }
}

// ---------- Initialization ----------
window.addEventListener('load', async () => {
  await initLive2D();
  if (localStorage.getItem('live2dTutorial') === '1') {
    tutorial.style.display = 'none';
    startCamera();
  } else {
    tutorial.style.display = 'flex';
  }
});

startBtn.addEventListener('click', startCamera);

window.addEventListener('beforeunload', () => {
  clearInterval(faceDetectionInterval);
  if (video.srcObject) {
    video.srcObject.getTracks().forEach(track => track.stop());
  }
  if (app) app.destroy(true);
});
</script>
</body>
 </html>
